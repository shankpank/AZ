<!doctype html>
<html><head><meta charset="utf-8"><title>JARVIS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>body{margin:0;background:#000;color:#00e5ff;font-family:Segoe UI}#scene{position:fixed;inset:0}#hud{position:fixed;top:20px;left:0;right:0;text-align:center}#subtitle{margin-top:8px}#map{position:fixed;bottom:20px;right:20px;width:440px;height:300px;display:none;border:1px solid #00e5ff55}#map.active{display:block}</style>
</head><body>
<div id="scene"></div><div id="hud"><div id="status">JARVIS — IDLE</div><div id="subtitle"></div></div><div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1e3);cam.position.z=5;const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});ren.setSize(innerWidth,innerHeight);sceneEl=document.getElementById('scene');sceneEl.appendChild(ren.domElement);const mat=new THREE.MeshBasicMaterial({color:0x00e5ff,wireframe:true});const core=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,1),mat);scene.add(core);let mode='idle';const col={idle:0x00e5ff,listening:0x00ff88,thinking:0xffcc00,speaking:0x4488ff};function setMode(m){mode=m;mat.color.setHex(col[m]||col.idle);document.getElementById('status').textContent='JARVIS — '+m.toUpperCase()}function anim(){requestAnimationFrame(anim);core.rotation.x+=.003;core.rotation.y+=.006;ren.render(scene,cam)}anim();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
let m=null,markers=[];function showMap(ms){const el=document.getElementById('map');el.classList.add('active');if(!m){m=L.map('map').setView([20,0],2);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',{subdomains:'abcd'}).addTo(m)}markers.forEach(x=>m.removeLayer(x));markers=[];(ms||[]).forEach(p=>{markers.push(L.circleMarker([p.lat,p.lng],{radius:8,color:'#00e5ff'}).bindPopup(p.name).addTo(m))})}
function hideMap(){document.getElementById('map').classList.remove('active')}
let last=-1;setInterval(async()=>{try{const s=await (await fetch('/state')).json();if(s.tick===last)return;last=s.tick;setMode(s.mode||'idle');document.getElementById('subtitle').textContent=s.subtitle||'';s.show_map?showMap(s.markers):hideMap()}catch{}},250);
</script></body></html>
